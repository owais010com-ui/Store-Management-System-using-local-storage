<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css">
    <title>Profit Loss Management</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <h1>Profit Loss Management</h1>

        <div class="totals">
            <div class="card green">
                <h4>Income</h4>
                <h2 id="totalIncome">0 Rs</h2>
            </div>

            <div class="card red">
                <h4>Expense</h4>
                <h2 id="totalExpense">0 Rs</h2>
            </div>

            <div class="card blue">
                <h4>Profit</h4>
                <h2 id="totalProfit">0 Rs</h2>
            </div>
        </div>

        <form onsubmit="getItems(); return false" class="form" id="itemForm">
            <input type="text" id="ItemName" placeholder="Enter Item Name">
            <input type="number" id="Amount" placeholder="Enter Amount">
            <button type="submit">Add Item</button>
        </form>

        <div id="listDetail"></div>

    </div>

    <script src="script.js"></script>
</body>

</html>
